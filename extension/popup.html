<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76,175,80,0.3);
        }
        .checkbox-group {
            margin-bottom: 12px;
        }
        input[type="checkbox"] {
            margin-right: 8px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:active {
            background-color: #3d8b40;
        }
        #status {
            margin-top: 10px;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            border-radius: 4px;
            display: none;
        }
        #status.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        #status.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input[type="password"],
        .password-container input[type="text"] {
            flex: 1;
            margin: 0;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            color: #666;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-toggle:hover {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 LPU Auto-Login</h2>
        
        <div class="form-group">
            <label for="regNo">Registration Number:</label>
            <input type="text" id="regNo" placeholder="Enter your registration number">
        </div>
        
        <div class="form-group">
            <label for="umsPassword">UMS Password:</label>
            <div class="password-container">
                <input type="password" id="umsPassword" placeholder="Enter your UMS password">
                <button type="button" class="password-toggle" id="umsToggle" title="Show/Hide password">👁️</button>
            </div>
        </div>
        
        <div class="checkbox-group">
            <label for="samePassword">
                <input type="checkbox" id="samePassword" checked>
                Same password for Internet
            </label>
        </div>
        
        <div class="form-group" id="internetPasswordGroup" style="display: none;">
            <label for="internetPassword">Internet Password:</label>
            <div class="password-container">
                <input type="password" id="internetPassword" placeholder="Enter your internet password">
                <button type="button" class="password-toggle" id="internetToggle" title="Show/Hide password">👁️</button>
            </div>
        </div>
        
        <div class="checkbox-group">
            <label for="autoLogin">
                <input type="checkbox" id="autoLogin" checked>
                Auto-login when page loads
            </label>
        </div>
        
        <button id="saveBtn">Save & Auto-Login</button>
        <div id="status"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
